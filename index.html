<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fenix - Catálogo Exclusivo</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="bg-overlay"></div>

    <header>
        <div class="container header-content">
            <div class="logo-container">
                <img src="logo.jpg" alt="Fenix Logo" class="logo">
                <h1>FENIX</h1>
            </div>
            <div class="cart-icon" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-count">0</span>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Encuentra lo que necesitas</h2>
            <p>Descubre nuestra colección exclusiva</p>
        </section>

        <section id="products" class="products-grid">
            <!-- Products will be injected here by JS -->
        </section>
    </main>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3>Tu Pedido</h3>
            <button onclick="toggleCart()" class="close-btn"><i class="fas fa-times"></i></button>
        </div>
        <div id="cart-items" class="cart-items">
            <!-- Cart items here -->
        </div>
        <div class="cart-footer">
            <div class="total">
                <span>Total:</span>
                <span id="cart-total">$0.00</span>
            </div>
            <button onclick="checkout()" class="checkout-btn">
                <i class="fab fa-whatsapp"></i> Finalizar y Enviar
            </button>
            <button onclick="clearCart()" class="clear-btn">Limpiar Carrito</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
